name: Issue Triage

# Fires when a new issue is opened in passport-cli-support: posts an
# acknowledgement comment so reporters know the issue was received.
# Uses only the built-in GITHUB_TOKEN — no external secrets required.
#
# workflow_dispatch is kept for manual/test runs: pass an existing issue
# number; mode=test prints the preview to the run summary instead of commenting.
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to triage (manual/test runs only)"
        required: true
        type: string
      mode:
        description: "test = dry-run (print, do not comment); prod = post comment"
        type: choice
        options:
          - prod
          - test
        default: test

permissions:
  contents: read
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # Real issue events default to prod; manual dispatch uses the chosen mode.
      MODE: ${{ github.event_name == 'issues' && 'prod' || inputs.mode }}
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
    steps:
      - name: Acknowledge new issue
        run: |
          set -euo pipefail

          TITLE="$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json title -q .title)"

          BODY="$(cat <<EOF
          👋 Thanks for opening this issue!

          **\"$TITLE\"** has been received and will be triaged by the passport-cli-support team.
          To speed things up, please make sure you've included:
          - CLI version / environment
          - Steps to reproduce
          - Expected vs. actual behaviour

          _(automated acknowledgement)_
          EOF
          )"

          if [ "$MODE" = "test" ]; then
            echo "### Triage preview for issue #$ISSUE_NUMBER (mode=test — not posted)" >> "$GITHUB_STEP_SUMMARY"
            echo "$BODY" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s' "$BODY" | gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file -
            echo "### Acknowledgement posted to issue #$ISSUE_NUMBER" >> "$GITHUB_STEP_SUMMARY"
          fi
